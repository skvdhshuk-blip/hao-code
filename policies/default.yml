# Default execpolicy rules for hao-code
# Fail-closed: commands not matched by any rule are denied.

rules:
  - name: bash-read-only
    tool: Bash
    cmd: "*"
    risk: normal
    allow_chain: false
    allow_auto: false
    env_deny:
      - LD_PRELOAD
      - DYLD_INSERT_LIBRARIES
      - DYLD_LIBRARY_PATH
      - PYTHONPATH
      - NODE_OPTIONS
      - PERL5OPT
    note: Default deny for chained commands; read-only bash allowed.

  - name: bash-git-status
    tool: Bash
    cmd: git
    args_match:
      - "status*"
    risk: normal
    allow_chain: false
    allow_auto: true
    env_deny:
      - LD_PRELOAD
      - DYLD_INSERT_LIBRARIES
      - DYLD_LIBRARY_PATH
      - PYTHONPATH
      - NODE_OPTIONS
      - PERL5OPT

  - name: bash-git-log
    tool: Bash
    cmd: git
    args_match:
      - "log*"
    risk: normal
    allow_chain: false
    allow_auto: true
    env_deny:
      - LD_PRELOAD
      - DYLD_INSERT_LIBRARIES
      - DYLD_LIBRARY_PATH
      - PYTHONPATH
      - NODE_OPTIONS
      - PERL5OPT

  - name: bash-git-diff
    tool: Bash
    cmd: git
    args_match:
      - "diff*"
    risk: normal
    allow_chain: false
    allow_auto: true
    env_deny:
      - LD_PRELOAD
      - DYLD_INSERT_LIBRARIES
      - DYLD_LIBRARY_PATH
      - PYTHONPATH
      - NODE_OPTIONS
      - PERL5OPT

  - name: bash-git-push-force
    tool: Bash
    cmd: git
    args_match:
      - "/push.*--force/"
    risk: high
    allow_chain: false
    allow_auto: false
    env_deny:
      - LD_PRELOAD
      - DYLD_INSERT_LIBRARIES
      - DYLD_LIBRARY_PATH
      - PYTHONPATH
      - NODE_OPTIONS
      - PERL5OPT
    note: Force push is high-risk and requires explicit approval.

  - name: bash-composer-install
    tool: Bash
    cmd: composer
    args_match:
      # Composer install can execute third-party code via plugins and scripts.
      # Only auto-allow when the caller has explicitly disabled both, which
      # matches Composer's own guidance for untrusted packages.
      - "/install.*--no-plugins/"
      - "/--no-scripts/"
    risk: normal
    allow_chain: false
    allow_auto: true
    env_deny:
      - LD_PRELOAD
      - DYLD_INSERT_LIBRARIES
      - DYLD_LIBRARY_PATH
      - PYTHONPATH
      - NODE_OPTIONS
      - PERL5OPT
    note: Auto-allow only with --no-plugins and --no-scripts; bare install requires approval.

  - name: bash-phpunit
    tool: Bash
    cmd: vendor/bin/phpunit
    risk: normal
    allow_chain: false
    allow_auto: false
    env_deny:
      - LD_PRELOAD
      - DYLD_INSERT_LIBRARIES
      - DYLD_LIBRARY_PATH
      - PYTHONPATH
      - NODE_OPTIONS
      - PERL5OPT
    note: PHPUnit executes project bootstrap, test classes and dependencies — never auto-allow.
