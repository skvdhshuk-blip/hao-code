name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP syntax
        run: composer run lint

      - name: Run full non-live test suite
        run: composer run test:full

      - name: Audit dependencies
        run: composer audit --format=plain

  windows-paths:
    name: Windows path compatibility
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check test discovery
        run: composer run test:discover

      - name: Run focused path compatibility tests
        run: >-
          php -d memory_limit=-1 vendor/bin/phpunit
          tests/Unit/BaseToolTest.php
          tests/Unit/GrepToolTest.php
          tests/Unit/GlobToolTest.php
          tests/Unit/TestDiscoveryCheckTest.php
          --no-progress
